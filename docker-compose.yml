services:

  postgres:
    image: postgres:16
    container_name: faketrello-postgres
    environment:
      POSTGRES_DB: fakeTrello
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Back-end/FakeTrello
    container_name: faketrello-backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=fakeTrello;Username=postgres;Password=super"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./Front-end/FakeTrello
    container_name: faketrello-front
    ports:
      - "4200:80"
    depends_on:
      - backend


volumes:
  postgres_data: