<div class="confirm-container">

    <div class="confirm-card">

        <h1>
            Email Confirmation
        </h1>


        <p *ngIf="!message && !isConfirmed">
            Click the button below to confirm your email address.
        </p>


        <button
            *ngIf="token && !isConfirmed"
            (click)="confirmEmail()"
            [disabled]="isLoading">

            {{ 
              isLoading 
              ? 'Confirming...' 
              : 'Confirm Email' 
            }}

        </button>


        <p 
            class="success"
            *ngIf="isConfirmed">

            {{ message }}

        </p>

        <p class="muted" *ngIf="isConfirmed">
            Redirecting to login in {{ redirectSeconds }}s...
        </p>

        <p 
            class="error"
            *ngIf="message && !isConfirmed">

            {{ message }}

        </p>

        <p class="back-link" *ngIf="isConfirmed || (message && !isConfirmed)">
            <a routerLink="/">Go to login</a>
        </p>

    </div>

</div>
