<div class="confirm-container">

    <div class="confirm-card">

        <div class="icon">
            🔑
        </div>

        <h1>
            Forgot Password
        </h1>

        <p *ngIf="!isSubmitted">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!isSubmitted">
            <input
                type="email"
                placeholder="Email address"
                formControlName="email" />

            <p class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
                Please enter a valid email address.
            </p>

            <button type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
            </button>
        </form>

        <p class="success" *ngIf="isSubmitted && !isError">
            {{ message }}
        </p>

        <p class="error" *ngIf="isSubmitted && isError">
            {{ message }}
        </p>

        <p class="back-link">
            <a [routerLink]="['/']">Back to login</a>
        </p>

    </div>

</div>
