<div class="confirm-container">

    <div class="confirm-card">

        <div class="icon">
            🔒
        </div>

        <h1>
            Reset Password
        </h1>

        <p *ngIf="token && !isSuccess">
            Enter your new password below.
        </p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="token && !isSuccess">
            <input
                type="password"
                placeholder="New password"
                formControlName="newPassword" />

            <p class="error" *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
                Password must be at least 6 characters long.
            </p>

            <input
                type="password"
                placeholder="Confirm new password"
                formControlName="confirmPassword" />

            <button type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Resetting...' : 'Reset Password' }}
            </button>
        </form>

        <p class="success" *ngIf="isSuccess">
            {{ message }}
        </p>

        <p class="error" *ngIf="isError && !isSuccess">
            {{ message }}
        </p>

        <p class="back-link">
            <a [routerLink]="['/']">Back to login</a>
        </p>

    </div>

</div>
